name: Build and Push Container

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "package*.json"
      - "Dockerfile"
      - "next.config.mjs"
      - "tailwind.config.ts"
      - "postcss.config.mjs"
      - "tsconfig.json"
      - ".github/workflows/container.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and push
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: |
          docker build -t ghcr.io/ventureforgre/dashboards:main -t "ghcr.io/ventureforgre/dashboards:${IMAGE_SHA}" .
          docker push ghcr.io/ventureforgre/dashboards:main
          docker push "ghcr.io/ventureforgre/dashboards:${IMAGE_SHA}"

      - name: Logout
        if: always()
        run: docker logout ghcr.io
