name: PR Title Check

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\(.+\))?!?: .+'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            printf 'ERROR: PR title must follow conventional commit format\n'
            printf 'Expected: feat: description, fix(scope): description, etc.\n'
            printf 'Got: %s\n' "$PR_TITLE"
            exit 1
          fi
          printf 'PR title is valid: %s\n' "$PR_TITLE"
